name: Deploy Pages
on:
  push:
    branches: [ master ]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 核心：给写入仓库的权限，解决git 128报错
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
